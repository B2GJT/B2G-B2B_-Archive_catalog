<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강의 뽑기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{
  --stage-1:#1B2333;
  --stage-2:#0E1420;
  --stage-glow:#3A4A6B;
  --red-1:#FF7A63;
  --red-2:#E8493B;
  --red-3:#A8291F;
  --red-4:#6E1712;
  --glass-hi:rgba(255,255,255,0.75);
  --glass-mid:rgba(210,235,255,0.28);
  --glass-low:rgba(120,170,210,0.16);
  --chrome-1:#F4F7FA;
  --chrome-2:#C7D1DA;
  --chrome-3:#8A97A3;
  --chrome-4:#4E5A66;
  --maroon-1:#7A342A;
  --maroon-2:#3D1712;
  --card:#ffffff;
  --card-ink:#241f1c;
  --ink:#EDEAE4;
  --ink-dim:#AFB4BF;
  --ink-faint:#7D8492;
  --line:rgba(255,255,255,0.10);
  --sans:'Pretendard-Regular','Pretendard',-apple-system,sans-serif;
  --display:'Pretendard-Black','Pretendard',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
body{
  background:
    radial-gradient(ellipse 620px 480px at 50% 30%, var(--stage-glow) 0%, transparent 62%),
    radial-gradient(ellipse 900px 700px at 50% 100%, #060a12 0%, transparent 60%),
    linear-gradient(180deg, var(--stage-1) 0%, var(--stage-2) 100%);
  color:var(--ink);
  font-family:var(--sans);
  min-height:100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:44px 18px 70px;
}
.page{width:100%;max-width:900px;}

/* ---------- Header ---------- */
.top{text-align:center;margin-bottom:26px;}
.eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.08);color:#B9E4D4;font-weight:800;font-size:12.5px;
  padding:6px 14px;border-radius:999px;margin-bottom:14px;letter-spacing:.02em;
  border:1px solid rgba(255,255,255,0.12);
}
h1{
  font-family:var(--display);
  font-size:34px;
  color:var(--ink);
  line-height:1.3;
  margin-bottom:8px;
  letter-spacing:-.01em;
}
h1 span{
  background:linear-gradient(180deg, var(--red-1), var(--red-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{color:var(--ink-dim);font-size:14.5px;line-height:1.6;}

/* ---------- Machine ---------- */
.machine-wrap{display:flex;justify-content:center;margin:8px 0 30px;position:relative;}
.machine{
  position:relative;
  width:500px;
  max-width:100%;
  padding-top:26px;
  filter: drop-shadow(0 26px 30px rgba(0,0,0,0.45));
}
.machine::after{
  /* floor contact shadow */
  content:"";position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);
  width:360px;height:28px;border-radius:50%;
  background:radial-gradient(ellipse, rgba(0,0,0,0.55), transparent 72%);
}
.dome-topper{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%, var(--chrome-1), var(--chrome-3) 65%, var(--chrome-4) 100%);
  box-shadow:0 3px 6px rgba(0,0,0,0.4), inset 0 -2px 3px rgba(0,0,0,0.25);
  z-index:5;
}
.dome{
  position:relative;
  width:460px;height:380px;
  margin:0 auto;
  border-radius:50% 50% 46% 46% / 62% 62% 38% 38%;
  overflow:hidden;
  z-index:2;
  background:
    linear-gradient(115deg, var(--glass-hi) 0%, transparent 16%),
    radial-gradient(circle at 68% 82%, rgba(20,40,60,0.10), transparent 55%),
    radial-gradient(circle at 30% 20%, var(--glass-mid), var(--glass-low) 60%, rgba(90,130,165,0.22) 100%);
  box-shadow:
    inset 0 0 0 3px rgba(255,255,255,0.35),
    inset 0 -30px 46px rgba(20,35,55,0.28),
    inset 18px 18px 40px rgba(255,255,255,0.30),
    0 2px 0 rgba(255,255,255,0.5);
}
.dome::before{
  /* diagonal glass glare streak */
  content:"";position:absolute;top:-10%;left:8%;width:26%;height:130%;
  background:linear-gradient(100deg, rgba(255,255,255,0.55), rgba(255,255,255,0) 70%);
  transform:rotate(6deg);
  pointer-events:none;
}
.dome::after{
  /* rim highlight ring */
  content:"";position:absolute;inset:0;border-radius:inherit;
  box-shadow: inset 0 0 0 6px rgba(255,255,255,0.14);
  pointer-events:none;
}
.dome .orbit{
  position:absolute;width:0;height:0;
  will-change:transform;
}
.dome .gumball{
  position:absolute;top:0;border-radius:50%;
  box-shadow:
    inset -10px -12px 18px rgba(0,0,0,0.35),
    inset 6px 8px 10px rgba(255,255,255,0.35),
    0 4px 8px rgba(0,0,0,0.25);
}
.dome .gumball::after{
  content:"";position:absolute;top:14%;left:20%;width:30%;height:22%;
  border-radius:50%;background:rgba(255,255,255,0.85);
  filter:blur(0.5px);
  transform:rotate(-20deg);
}

.machine-body{
  width:490px;height:140px;
  margin:-6px auto 0;
  border-radius:0 0 26px 26px;
  position:relative;
  z-index:1;
  background:
    linear-gradient(100deg, rgba(255,255,255,0.30) 0%, transparent 22%),
    linear-gradient(90deg, var(--red-4) 0%, var(--red-2) 18%, var(--red-1) 46%, var(--red-2) 74%, var(--red-4) 100%);
  box-shadow:
    inset 0 3px 4px rgba(255,255,255,0.35),
    inset 0 -18px 30px rgba(0,0,0,0.30);
}
.machine-body::before{
  /* chrome trim ring where dome meets body */
  content:"";position:absolute;top:-9px;left:6px;right:6px;height:17px;
  border-radius:13px;
  background:linear-gradient(180deg, var(--chrome-1), var(--chrome-3) 55%, var(--chrome-4));
  box-shadow:0 3px 6px rgba(0,0,0,0.35), inset 0 2px 2px rgba(255,255,255,0.6);
}
.coin-mech{
  position:absolute;top:26px;left:50%;transform:translateX(-50%);
  width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, var(--chrome-1) 0%, var(--chrome-2) 45%, var(--chrome-4) 100%);
  box-shadow:0 4px 8px rgba(0,0,0,0.4), inset 0 -3px 5px rgba(0,0,0,0.3), inset 0 2px 3px rgba(255,255,255,0.6);
  z-index:2;
}
.coin-mech-bar{
  position:absolute;top:50%;left:50%;width:9px;height:70%;
  background:linear-gradient(90deg, var(--chrome-4), var(--chrome-2) 50%, var(--chrome-4));
  border-radius:5px;
  transform:translate(-50%,-50%) rotate(18deg);
  box-shadow:inset 0 0 2px rgba(0,0,0,0.5);
}
.dispense-arch{
  position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  width:68px;height:40px;
  border-radius:34px 34px 0 0;
  background:radial-gradient(circle at 50% 120%, var(--maroon-1), var(--maroon-2) 75%);
  box-shadow:inset 0 10px 16px rgba(0,0,0,0.55), inset 0 -2px 3px rgba(255,255,255,0.08);
}
.machine-stand{
  width:430px;height:14px;margin:-2px auto 0;max-width:88%;
  border-radius:0 0 9px 9px;
  background:linear-gradient(180deg, var(--red-3), var(--red-4));
  box-shadow:inset 0 2px 3px rgba(255,255,255,0.2);
}

/* ---------- Form ---------- */
.form-block{margin-top:26px;}
label.field-label{
  display:block;font-size:13.5px;font-weight:700;color:var(--ink-dim);
  margin-bottom:8px;
}
.input-row{display:flex;gap:10px;}
#needInput{
  flex:1;padding:14px 17px;border-radius:14px;border:1px solid rgba(255,255,255,0.14);
  font-size:14.5px;font-family:var(--sans);outline:none;
  background:rgba(255,255,255,0.06);color:var(--ink);
  transition:border-color .15s ease, background .15s ease;
}
#needInput::placeholder{color:var(--ink-faint);}
#needInput:focus{border-color:var(--red-1);background:rgba(255,255,255,0.09);}
#drawBtn{
  flex:none;padding:13px 26px;border:none;border-radius:14px;cursor:pointer;
  background:linear-gradient(180deg, var(--red-1), var(--red-2) 70%, var(--red-3));
  color:#fff;font-weight:800;font-size:14.5px;
  font-family:var(--display);letter-spacing:.02em;
  box-shadow:
    0 5px 0 var(--red-4),
    0 10px 18px rgba(0,0,0,0.35),
    inset 0 2px 1px rgba(255,255,255,0.5);
  transition:transform .08s ease, box-shadow .08s ease;
}
#drawBtn:hover{filter:brightness(1.06);}
#drawBtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--red-4), inset 0 2px 1px rgba(255,255,255,0.4);}
#drawBtn:disabled{opacity:.55;cursor:not-allowed;}
.hint{font-size:12px;color:var(--ink-faint);margin-top:9px;line-height:1.6;}
.status-line{
  margin-top:14px;font-size:13.5px;color:var(--ink-dim);min-height:18px;
  display:flex;align-items:center;gap:6px;
}
.status-line.error{color:#FF8A7A;}

/* ---------- Result area ---------- */
.result-wrap{margin-top:8px;}
.capsule-row{
  display:flex;gap:22px;justify-content:center;margin-top:26px;
  flex-wrap:wrap;
}
.slot{
  position:relative;width:250px;min-height:250px;
}
.capsule{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  border-radius:50%;
  opacity:0;
  pointer-events:none;
}
.capsule.dropping{opacity:1;animation:dropIn .95s cubic-bezier(.34,1.15,.64,1) forwards;}
@keyframes dropIn{
  0%{transform:translate(0,-300px) rotate(-30deg);opacity:0;}
  45%{opacity:1;}
  55%{transform:translate(0,4px) rotate(240deg);}
  64%{transform:translate(18px,10px) rotate(430deg);}
  73%{transform:translate(-14px,6px) rotate(560deg);}
  82%{transform:translate(9px,3px) rotate(650deg);}
  90%{transform:translate(-4px,1px) rotate(700deg);}
  100%{transform:translate(0,0) rotate(720deg);opacity:1;}
}
.cap-top, .cap-bottom{
  position:absolute;left:6px;right:6px;height:50%;
  box-shadow:
    inset -10px -12px 16px rgba(0,0,0,0.30),
    inset 6px 8px 10px rgba(255,255,255,0.35),
    0 6px 10px rgba(0,0,0,0.35);
}
.cap-top{top:6px;border-radius:110px 110px 10px 10px;}
.cap-bottom{bottom:6px;border-radius:10px 10px 110px 110px;}
.capsule.opening .cap-top{
  transition:transform .5s cubic-bezier(.36,1.6,.6,1), opacity .5s ease;
  transform:translateY(-70px) rotate(-30deg);opacity:0;
}
.capsule.opening .cap-bottom{
  transition:transform .5s cubic-bezier(.36,1.6,.6,1), opacity .5s ease;
  transform:translateY(60px) rotate(20deg);opacity:0;
}
.result-card{
  position:absolute;inset:0;
  background:linear-gradient(180deg, #ffffff, #FAF8F5);
  border-radius:20px;
  padding:18px 16px 16px;
  display:flex;flex-direction:column;
  overflow:hidden;
  opacity:0;transform:scale(.8) translateY(6px);
  transition:opacity .4s ease .18s, transform .4s cubic-bezier(.34,1.5,.64,1) .18s;
  box-shadow:
    0 18px 34px rgba(0,0,0,0.45),
    0 0 0 1.5px rgba(255,255,255,0.08),
    0 0 0 4px var(--card-glow, rgba(0,0,0,0));
}
.result-card.show{opacity:1;transform:scale(1) translateY(0);}
.result-card::before{
  /* shine sweep on reveal */
  content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,0.65), transparent);
  transform:skewX(-18deg);
  opacity:0;
}
.result-card.show::before{animation:shine 1s ease .5s 1;}
@keyframes shine{
  0%{left:-60%;opacity:0;}
  15%{opacity:1;}
  60%{opacity:.5;}
  100%{left:130%;opacity:0;}
}
.tag-chip{
  align-self:flex-start;font-size:11px;font-weight:800;color:#fff;
  padding:5px 11px;border-radius:999px;margin-bottom:10px;
  box-shadow:0 2px 5px rgba(0,0,0,0.18);
}
.result-card .cname{
  font-size:14.5px;font-weight:800;line-height:1.45;color:var(--card-ink);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  margin-bottom:8px;
}
.result-card .reason{
  font-size:12.5px;color:#6b6058;line-height:1.55;flex:1;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.result-card .foot{
  display:flex;align-items:center;justify-content:space-between;margin-top:10px;
}
.result-card .count{font-size:11.5px;color:#a89c92;font-weight:600;}
.result-card .go{
  font-size:12.5px;font-weight:800;color:var(--card-ink);text-decoration:none;
  display:inline-flex;align-items:center;gap:3px;
}
.result-card .go:hover{text-decoration:underline;}

.again-row{display:flex;justify-content:center;margin-top:24px;}
#againBtn{
  display:none;
  padding:10px 22px;border-radius:999px;border:1.5px solid rgba(255,255,255,0.3);
  background:transparent;color:var(--ink);font-weight:700;font-size:13.5px;
  cursor:pointer;font-family:var(--sans);
  transition:background .15s ease, border-color .15s ease;
}
#againBtn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.5);}

@media (prefers-reduced-motion: reduce){
  .capsule.dropping{animation:none;opacity:1;transform:none;}
  .capsule.opening .cap-top,.capsule.opening .cap-bottom{transition:opacity .2s ease;}
}
@media (max-width:480px){
  h1{font-size:27px;}
  .input-row{flex-direction:column;}
  #drawBtn{width:100%;}
}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div class="eyebrow">Day1company 아카이브</div>
    <h1>🎡나만의 강의 뽑기</h1><br><br>
    <p class="sub">배우고 싶은 내용 또는 직무를 간단하게 적어주세요.<br> 나만의 강의 3개를 뽑아드려요.</p>
  </div>

  <div class="machine-wrap">
    <div class="machine">
      <div class="dome-topper"></div>
      <div class="dome" id="dome"></div>
      <div class="machine-body">
        <div class="coin-mech"><div class="coin-mech-bar"></div></div>
        <div class="dispense-arch"></div>
      </div>
      <div class="machine-stand"></div>
    </div>
  </div>

  <div class="form-block">
    <label class="field-label" for="needInput">듣고싶은 강의 내용을 입력해주세요.</label>
    <div class="input-row">
      <input id="needInput" type="text" placeholder="예: 엑셀 자동화 배우고 싶어요 / 신입 마케터인데 AI 활용법" autocomplete="off" maxlength="120">
      <button id="drawBtn">뽑기!</button>
    </div>
    <div class="hint">Enter 눌러도 뽑을 수 있어요.</div>
    <div class="status-line" id="statusLine"></div>
  </div>

  <div class="result-wrap">
    <div class="capsule-row" id="capsuleRow"></div>
    <div class="again-row"><button id="againBtn">다시 뽑기</button></div>
  </div>

<script>
const CATALOG = JSON.parse(document.getElementById('catalog-data').textContent);
const CAPSULE_COLORS = ['#FFC93C','#5CC8FF','#FF8FB1','#8FE3A6','#B48CFF','#FF9F5B'];
const PICK_COUNT = 3;

const dome = document.getElementById('dome');
const needInput = document.getElementById('needInput');
const drawBtn = document.getElementById('drawBtn');
const statusLine = document.getElementById('statusLine');
const capsuleRow = document.getElementById('capsuleRow');
const againBtn = document.getElementById('againBtn');

// gumballs that actually churn around each other, like a lottery-draw machine —
// each ball orbits a center point at its own radius/speed/direction, with a
// slow radius "breathe" layered in so the mix never looks like a fixed loop.
// Driven by rAF (not CSS animation) so it can't silently stall and so the
// draw flow can speed it up on demand.
const domeMotion = (function seedDome(){
  const palette = Array.from(new Set(CATALOG.map(c=>c.c))).slice(0,11);
  while(palette.length < 11) palette.push(CAPSULE_COLORS[palette.length % CAPSULE_COLORS.length]);

  const cx = 230, cy = 216; // base orbit center, tuned to the 460x380 dome
  const balls = [
    {r:150, size:60, speed:24, dir:1,  ox:-30, oy:-10},
    {r:80,  size:66, speed:38, dir:-1, ox:15,  oy:5},
    {r:115, size:58, speed:31, dir:1,  ox:38,  oy:15},
    {r:170, size:54, speed:19, dir:-1, ox:-40, oy:26},
    {r:60,  size:64, speed:48, dir:1,  ox:2,   oy:-20},
    {r:135, size:62, speed:26, dir:-1, ox:20,  oy:-8},
    {r:95,  size:56, speed:34, dir:1,  ox:-15, oy:20},
    {r:155, size:50, speed:21, dir:-1, ox:45,  oy:-14},
    {r:70,  size:60, speed:42, dir:1,  ox:-25, oy:8},
    {r:110, size:52, speed:29, dir:-1, ox:0,   oy:30},
    {r:145, size:56, speed:23, dir:1,  ox:-8,  oy:-24},
  ];

  const items = balls.map((b,i)=>{
    const orbit = document.createElement('div');
    orbit.className = 'orbit';
    orbit.style.left = (cx + b.ox)+'px';
    orbit.style.top = (cy + b.oy)+'px';

    const ball = document.createElement('div');
    ball.className = 'gumball';
    ball.style.width = b.size+'px';
    ball.style.height = b.size+'px';
    ball.style.left = '0px';
    ball.style.marginLeft = (-b.size/2)+'px';
    ball.style.marginTop = (-b.size/2)+'px';
    ball.style.background = sphereGradient(palette[i % palette.length]);
    ball.style.zIndex = String(10 - i);

    orbit.appendChild(ball);
    dome.appendChild(orbit);

    return { ...b, el: orbit, angle: Math.random()*360, wobblePhase: Math.random()*Math.PI*2 };
  });

  function place(b, rr){
    const rad = b.angle * Math.PI/180;
    const x = Math.cos(rad) * rr;
    const y = Math.sin(rad) * rr * 0.86; // slight ellipse to match the dome's squashed shape
    b.el.style.transform = `translate3d(${x}px, ${y}px, 0)`;
  }

  let speedMul = 1;
  let last = performance.now();
  (function frame(now){
    const dt = Math.min((now - last)/1000, 0.05);
    last = now;
    items.forEach(b=>{
      b.angle = (b.angle + b.dir * b.speed * speedMul * dt) % 360;
      const breathe = Math.sin(now/1000*0.5 + b.wobblePhase) * 6;
      place(b, b.r + breathe);
    });
    requestAnimationFrame(frame);
  })(last);

  return {
    boost(mul){ speedMul = mul; },
    reset(){ speedMul = 1; }
  };
})();

function setStatus(text, isError){
  statusLine.textContent = text || '';
  statusLine.classList.toggle('error', !!isError);
}

function norm(s){
  return (s||'').replace(/[\[\]［］]/g,'').replace(/\s+/g,'').toLowerCase();
}

function localFallback(need, count){
  const tokens = need.split(/[\s,·\/&]+/).map(t=>t.trim()).filter(t=>t.length>1);
  const scored = CATALOG.map(c=>{
    const hay = (c.name + ' ' + c.tag).toLowerCase();
    let score = 0;
    tokens.forEach(t=>{ if(hay.includes(t.toLowerCase())) score += 2; });
    return {c, score};
  }).sort((a,b)=>b.score-a.score);

  const withScore = scored.filter(s=>s.score>0);
  const pool = withScore.length >= count ? withScore : scored;
  const picks = [];
  const usedTags = new Set();
  for(const s of pool){
    if(picks.length>=count) break;
    if(picks.find(p=>p.c.name===s.c.name)) continue;
    picks.push(s);
  }
  return picks.slice(0,count).map(p=>({
    name: p.c.name,
    reason: p.score>0 ? `"${need}"와 관련된 "${p.c.tag}" 분야 강의예요` : `요즘 많이 찾는 "${p.c.tag}" 분야 강의예요`
  }));
}

function matchCatalog(name){
  const n = norm(name);
  let hit = CATALOG.find(c => norm(c.name) === n);
  if(hit) return hit;
  hit = CATALOG.find(c => norm(c.name).includes(n) || n.includes(norm(c.name)));
  return hit || null;
}

async function getPicks(need){
  const catalogText = CATALOG.map(c => `- ${c.name} (${c.tag})`).join('\n');
  const body = {
    model: "claude-sonnet-4-6",
    max_tokens: 1000,
    system: "당신은 사내 교육 강의 큐레이터입니다. 아래 강의 목록(이름, 태그)에서 사용자의 니즈에 가장 잘 맞는 강의를 정확히 3개 골라주세요. 목록에 없는 강의명을 절대 지어내지 말고, 목록에 있는 강의명을 정확히 그대로 사용하세요. 서로 다른 강의 3개를 고르세요. 다른 설명 없이 아래 JSON 형식으로만 응답하세요:\n{\"picks\":[{\"name\":\"목록에 있는 정확한 강의명\",\"reason\":\"한 문장 이유 (존댓말, 30자 이내)\"},{\"name\":\"...\",\"reason\":\"...\"},{\"name\":\"...\",\"reason\":\"...\"}]}",
    messages: [{ role: "user", content: `강의 목록:\n${catalogText}\n\n사용자 니즈: "${need}"` }]
  };
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  const textBlock = (data.content||[]).find(b=>b.type==='text');
  if(!textBlock) throw new Error('no text');
  const clean = textBlock.text.replace(/```json|```/g,'').trim();
  const parsed = JSON.parse(clean);
  if(!parsed.picks || parsed.picks.length<PICK_COUNT) throw new Error('bad shape');

  const resolved = [];
  for(const p of parsed.picks){
    const m = matchCatalog(p.name);
    if(m && !resolved.find(r=>r.c.name===m.name)){
      resolved.push({ c:m, reason: p.reason || '' });
    }
  }
  if(resolved.length<PICK_COUNT) throw new Error('unresolved picks');
  return resolved.slice(0,PICK_COUNT);
}

function buildSlots(){
  capsuleRow.innerHTML = '';
  const slots = [];
  for(let i=0;i<PICK_COUNT;i++){
    const slot = document.createElement('div');
    slot.className = 'slot';
    const capsule = document.createElement('div');
    capsule.className = 'capsule';
    const top = document.createElement('div'); top.className='cap-top';
    const bottom = document.createElement('div'); bottom.className='cap-bottom';
    capsule.appendChild(top); capsule.appendChild(bottom);
    const card = document.createElement('div');
    card.className = 'result-card';
    slot.appendChild(capsule);
    slot.appendChild(card);
    capsuleRow.appendChild(slot);
    slots.push({slot, capsule, top, bottom, card});
  }
  return slots;
}

function fillCard(card, pick){
  const c = pick.c;
  card.style.setProperty('--card-glow', hexToRgba(c.c, 0.55));
  card.innerHTML = `
    <span class="tag-chip" style="background:${c.c}">${escapeHtml(c.tag)}</span>
    <div class="cname">${escapeHtml(c.name)}</div>
    <div class="reason">${escapeHtml(pick.reason || '')}</div>
    <div class="foot">
      <span class="count">총 ${c.count}강</span>
      <a class="go" href="${c.url}" target="_blank" rel="noopener noreferrer">1강 보러가기 →</a>
    </div>
  `;
}

function hexToRgba(hex, alpha){
  const h = (hex||'#888888').replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function sphereGradient(hex){
  const light = shade(hex, 34);
  const dark = shade(hex, -30);
  return `radial-gradient(circle at 32% 26%, ${light} 0%, ${hex} 55%, ${dark} 100%)`;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function draw(){
  const need = needInput.value.trim();
  if(!need){ setStatus('어떤 게 필요한지 한 줄만 적어주세요.', true); needInput.focus(); return; }

  drawBtn.disabled = true; needInput.disabled = true; againBtn.style.display='none';
  setStatus('강의를 고르고 있어요...');
  dome.classList.add('shaking');
  domeMotion.boost(4);
  capsuleRow.innerHTML = '';

  let picks;
  try{
    picks = await getPicks(need);
  }catch(err){
    picks = localFallback(need, PICK_COUNT).map(p=>({ c: matchCatalog(p.name), reason: p.reason })).filter(p=>p.c);
    if(picks.length<PICK_COUNT){
      const extra = localFallback('', PICK_COUNT).map(p=>({ c: matchCatalog(p.name), reason: p.reason })).filter(p=>p.c);
      for(const e of extra){ if(picks.length<PICK_COUNT && !picks.find(p=>p.c.name===e.c.name)) picks.push(e); }
    }
  }

  dome.classList.remove('shaking');
  domeMotion.reset();
  setStatus('');

  const slots = buildSlots();
  const colors = [...CAPSULE_COLORS].sort(()=>Math.random()-0.5);

  slots.forEach((s, i)=>{
    const color = colors[i];
    s.top.style.background = sphereGradient(color);
    s.bottom.style.background = sphereGradient(shade(color, -14));
  });

  // drop animation, staggered
  slots.forEach((s,i)=>{
    setTimeout(()=>{ s.capsule.classList.add('dropping'); }, i*180);
  });

  const dropDuration = 620 + slots.length*180 + 250;
  setTimeout(()=>{
    slots.forEach((s, i)=>{
      fillCard(s.card, picks[i]);
      setTimeout(()=>{
        s.capsule.classList.add('opening');
        requestAnimationFrame(()=> s.card.classList.add('show'));
      }, i*150);
    });
    drawBtn.disabled = false; needInput.disabled = false; againBtn.style.display='inline-block';
  }, dropDuration);
}

function shade(hex, percent){
  const num = parseInt(hex.slice(1),16);
  let r = (num>>16) + Math.round(255*percent/100);
  let g = ((num>>8)&0xff) + Math.round(255*percent/100);
  let b = (num&0xff) + Math.round(255*percent/100);
  r = Math.min(255,Math.max(0,r)); g = Math.min(255,Math.max(0,g)); b = Math.min(255,Math.max(0,b));
  return '#' + (r<<16|g<<8|b).toString(16).padStart(6,'0');
}

drawBtn.addEventListener('click', draw);
needInput.addEventListener('keydown', e => { if(e.key==='Enter') draw(); });
againBtn.addEventListener('click', ()=>{
  needInput.value=''; needInput.focus();
  capsuleRow.innerHTML=''; setStatus(''); againBtn.style.display='none';
});
</script>
